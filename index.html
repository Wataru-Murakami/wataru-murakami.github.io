<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Wataru Murakami — artist website. Currently under construction.">
  <title>Wataru Murakami</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100svh;
      background: #faf9f6;
      color: #222222;
      font-family: Arial, Helvetica, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    main {
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 3rem 1.5rem;
    }
    h1 {
      margin: 0;
      font-family: Georgia, 'Times New Roman', serif;
      font-size: clamp(2.15rem, 5vw, 4.25rem);
      font-weight: 400;
      letter-spacing: -0.035em;
      line-height: 1.15;
    }
    .rule {
      height: 1px;
      width: 38px;
      background: #aaa6a0;
      margin: 2.4rem 0 2rem;
    }
    p {
      margin: 0;
      color: #77736e;
      font-size: 0.75rem;
      font-weight: 400;
      letter-spacing: 0.13em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <main>
    <h1>Wataru Murakami</h1>
    <div class="rule" aria-hidden="true"></div>
    <p>Website under construction</p>
  </main>
</body>
</html>
